# Orca launcher profile: Project+ v3.2 (Project+ Development Team), on Super Smash Bros. Brawl
# (NTSC-U) revision 2. Selected with ORCA_PROFILE=PPLUS32 when a session boots the Project+ Netplay
# Launcher. None of Project+'s files are part of Orca: the player's machine downloads the official
# v3.2 release (Project+.v3.2.Netplay.<platform>.zip, from the Project+ Dolphin GitHub releases that
# projectplusgame.com links; the macOS and Windows zips carry the same files). The release keeps them
# in user/Launcher/ and user/Wii/; the session needs the launcher and the SD card image in one folder
# (the app copies or links them there). The hashes below pin exactly those files. The settings every session forces live in Source/Core/Core/Orca/Profile.cpp.

[Profile]
# The disc the launcher boots from the drive (Dolphin's default disc).
Disc = RSBE01
Revision = 2
# XXH3-128 of user/Launcher/Project+ Netplay Launcher.dol (SHA-256 74a0decf...c0da).
Launcher = 1e45a9a7ce1b8837020d15bc1379c21e
# user/Wii/sd.raw (2,097,152,000 bytes; SHA-256 cfe5d869...2d2d), next to the launcher.
SDImage = sd.raw
SDImageHash = 5293a846d4de6139fd3ccd61faa9ac8d
# The save the session NAND is seeded with: Brawl's (the launcher itself is title 0).
SaveTitle = 0x0001000052534245
# Brawl's frame loop: Project+'s codes leave it where vanilla has it.
FrameHook = 0x80017504
FrameHookWord = 0x90170100
# Drop-in keyframes: by frame 300 the boot has written its NAND /tmp files (2.3 MB, the same bytes
# with or without input), so a joining friend makes them with its own boot to here.
BootNandFrame = 600

[Forced]
# The card holds the codeset and every Project+ asset; the session opens it read-only.
Dolphin.Core.WiiSDCard = True
# A later pinned clock than the universal one. At 2000-01-01 (the console epoch) Brawl never detects
# a GameCube controller after the launcher boots it (RAM was byte-identical with and without input);
# at 2025-01-01 it does. Probably the launcher seeding the time base from the RTC (not traced).
Dolphin.Core.CustomRTCValue = 1735689600
