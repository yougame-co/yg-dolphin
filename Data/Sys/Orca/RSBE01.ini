# Orca profile: Super Smash Bros. Brawl (NTSC-U). Applied to both players of a rollback session.
# Keys use the command line's -C syntax: <System>.<Section>.<Key> = <Value>.

[Profile]
Revision = 2
# End of Brawl's frame loop (stw r0,0x100(r23)), used as the frame boundary until Orca has a
# game-agnostic one.
FrameHook = 0x80017504
# The instruction expected there (stw r0,0x100(r23)); a mismatch means a different build of the game.
FrameHookWord = 0x90170100

[Forced]
# CPU and timing (the CPU core itself is set in code: the platform's JIT).
Dolphin.Core.CPUThread = False
Dolphin.Core.OverclockEnable = False
Dolphin.Core.VIOverclockEnable = False
Dolphin.Core.MMU = False
Dolphin.Core.AccurateNaNs = False
Dolphin.Core.FPRF = False
Dolphin.Core.FloatExceptions = False
Dolphin.Core.DivByZeroExceptions = False
Dolphin.Core.RAMOverrideEnable = False
Dolphin.Core.EnableCustomRTC = True
Dolphin.Core.CustomRTCValue = 946684800
Dolphin.Core.DSPHLE = True
Dolphin.Core.FastDiscSpeed = False
Dolphin.Core.SkipIPL = True
Dolphin.Core.EnableCheats = False
Dolphin.Core.WiiSDCard = False
# 1v1: two GameCube controllers (6 = SIDEVICE_GC_CONTROLLER), ports 3 and 4 empty.
Dolphin.Core.SIDevice0 = 6
Dolphin.Core.SIDevice1 = 6
Dolphin.Core.SIDevice2 = 0
Dolphin.Core.SIDevice3 = 0
# Graphics: copies stay on the GPU so RAM gets a constant placeholder, never pixels; no CPU
# readbacks of GPU results; no graphics mods (they can skip copies).
GFX.Hacks.EFBToTextureEnable = True
GFX.Hacks.XFBToTextureEnable = True
GFX.Hacks.DeferEFBCopies = True
GFX.Hacks.ImmediateXFBEnable = False
GFX.Hacks.EFBAccessEnable = False
GFX.Hacks.BBoxEnable = False
GFX.Hacks.EFBEmulateFormatChanges = False
GFX.GameSpecific.PerfQueriesEnable = False
GFX.Settings.EnableMods = False
