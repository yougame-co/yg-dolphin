# Orca profile: Super Smash Bros. Brawl (NTSC-U). The settings every Orca session forces live in
# Source/Core/Core/Orca/Profile.cpp; [Forced] here holds only Brawl-specific additions, as
# <System>.<Section>.<Key> = <Value> (the command line's -C syntax). Any malformed line refuses the
# session.

[Profile]
Revision = 2
# End of Brawl's frame loop, used as the frame boundary until Orca has a game-agnostic one.
FrameHook = 0x80017504
# The instruction expected there (stw r0,0x100(r23)); a mismatch means a different build of the game.
FrameHookWord = 0x90170100
# Drop-in keyframes: the strap screen writes 37 MB of packs to the NAND's /tmp by frame ~1513, the
# same bytes whatever the player presses, so a joining friend makes them with its own boot.
BootNandFrame = 1800

[Forced]
