# YG Dolphin linux-x64 build (linux-lead). MANUAL ONLY: workflow_dispatch, never on push or pull_request,
# never a required check, so it cannot block a merge. YouGame's "no CI" rule (Luis 2026-09-16) is about
# the YouGame repo (cost, blocked merges); this one builds the engine's Linux zip so a staging swap never
# has to drop Linux when the Legion test handheld is asleep (10-24).
#
# Two flavors: staging (the STAGING key, ORCA_STAGING_BUILD=1) and prod (the PRODUCTION key, no staging flag).
# No secrets: the zip embeds only the PUBLIC flat-bundle key of its flavor (both keys are public; the packaging
# script refuses the staging key outside a staging build, and the TEST key always). Signing stays with
# orca-lead's local tools (orca-add-build).
# No game files: the frame-for-frame check needs a Brawl disc image, which never goes to GitHub. It runs
# afterwards on a Linux machine that has the disc (the Legion, or WSL2 on the PC), together with the in-app check.
name: linux-x64 build (manual)

# The run's title carries its inputs; the signing side checks it through the API (verify-ci-artifact).
run-name: "linux-x64 ${{ inputs.version }} commit=${{ inputs.commit }} source=${{ inputs.source_commit }} flavor=${{ inputs.flavor }}${{ inputs.cli_tool && ' dolphin-tool-only' || '' }}"

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Public snapshot commit to build (full sha, on ci/<version>)"
        required: true
      source_commit:
        description: "The PRIVATE release commit it was made from (full sha): goes into the compatibility key"
        required: true
      version:
        description: "YG Dolphin version, X.Y.Z"
        required: true
      flavor:
        description: "Bundle-key flavor: staging (STAGING key) or prod (PRODUCTION key)"
        required: true
        default: staging
        type: choice
        options: [staging, prod]
      cli_tool:
        description: "Build ONLY dolphin-tool (for extracting a player's own disc); no engine or release zip"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: linux-x64-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04 # glibc 2.35, the same base as the Legion's build container
    timeout-minutes: 150
    defaults:
      run:
        shell: bash # runs as bash -eo pipefail: a failing command before a pipe fails the step
    steps:
      - name: Check the inputs (they reach shell steps only after this)
        env:
          COMMIT: ${{ inputs.commit }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VERSION: ${{ inputs.version }}
          FLAVOR: ${{ inputs.flavor }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be a full 40-hex sha"; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "source_commit must be a full 40-hex sha"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z"; exit 1; }
          [[ "$FLAVOR" == staging || "$FLAVOR" == prod ]] || { echo "flavor must be staging or prod"; exit 1; }

      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned 2026-10-24
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Submodules (as linux-release.sh does, all but Qt and FFmpeg-bin)
        run: |
          for m in $(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}'); do
            case "$m" in Externals/Qt|Externals/FFmpeg-bin) continue ;; esac
            git submodule update --init --recursive --depth 1 -- "$m" || git submodule update --init --recursive -- "$m"
          done
          test -z "$(git status --porcelain)" || { echo "tree not clean"; git status --short | head; exit 1; }
          grep -q 'ENABLE_VULKAN=ON' Tools/orca-package-linux.sh

      - name: Packages (the Legion build container's list)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ninja-build pkg-config zip binutils ccache \
            gcc-12 g++-12 libx11-dev libxi-dev libxext-dev libxrandr-dev libegl-dev libgl-dev \
            libpulse-dev libasound2-dev libudev-dev libvulkan-dev
          cmake --version | head -1

      - name: Compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, pinned 2026-10-24
        with:
          path: ~/.cache/ccache
          key: ccache-linux-x64-${{ inputs.commit }}
          restore-keys: ccache-linux-x64-

      - name: Build and package (Tools/orca-package-linux.sh, ${{ inputs.flavor }} flavor)
        if: ${{ !inputs.cli_tool }}
        env:
          CC: gcc-12
          CXX: g++-12
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ~/.cache/ccache
          ORCA_VERSION: ${{ inputs.version }}
          ORCA_SOURCE_URL: https://github.com/yougame-co/orca-netplay
          # staging: "1"; prod: empty, and unset below (the script then refuses the STAGING key).
          ORCA_STAGING_BUILD: ${{ inputs.flavor == 'staging' && '1' || '' }}
          ORCA_SOURCE_COMMIT: ${{ inputs.source_commit }}
          # prod: the PRODUCTION key; staging: the STAGING key.
          ORCA_BUNDLE_PUBLIC_KEY: ${{ inputs.flavor == 'prod' && '3b658bd504fde78f3ddd9bcb04a93a095df737fbbe657e83ba373f994cfcd87f' || '8422b8b28b82aff024427d77e6c72a38d9ea75bcb6533fe706c61006f742c0ab' }}
        run: |
          [ -n "$ORCA_STAGING_BUILD" ] || unset ORCA_STAGING_BUILD
          export CCACHE_DIR="$HOME/.cache/ccache"
          Tools/orca-package-linux.sh "$RUNNER_TEMP/build" "$RUNNER_TEMP/out"
          ccache -s | head -8 || true
          Z="$RUNNER_TEMP/out/yg-dolphin-${ORCA_VERSION}-linux-x64.zip"
          test -f "$Z"
          sha256sum "$Z" | tee "$RUNNER_TEMP/out/SHA256SUMS"
          stat -c '%s bytes' "$Z"

      - name: Upload the zip and its sha256
        if: ${{ !inputs.cli_tool }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned 2026-10-24
        with:
          name: yg-dolphin-${{ inputs.version }}-${{ inputs.commit }}-linux-x64-${{ inputs.flavor }}
          path: |
            ${{ runner.temp }}/out/yg-dolphin-${{ inputs.version }}-linux-x64.zip
            ${{ runner.temp }}/out/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

      - name: Build dolphin-tool only (cli_tool; orca-package-linux.sh's switches, CLI tool on)
        if: ${{ inputs.cli_tool }}
        env:
          CC: gcc-12
          CXX: g++-12
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          ORCA_VERSION: ${{ inputs.version }}
          ORCA_STAGING_BUILD: ${{ inputs.flavor == 'staging' && '1' || '' }}
          ORCA_SOURCE_COMMIT: ${{ inputs.source_commit }}
          BUNDLE_KEY: ${{ inputs.flavor == 'prod' && '3b658bd504fde78f3ddd9bcb04a93a095df737fbbe657e83ba373f994cfcd87f' || '8422b8b28b82aff024427d77e6c72a38d9ea75bcb6533fe706c61006f742c0ab' }}
        run: |
          [ -n "$ORCA_STAGING_BUILD" ] || unset ORCA_STAGING_BUILD
          export CCACHE_DIR="$HOME/.cache/ccache"
          ROOT="$PWD"; B="$RUNNER_TEMP/build"
          cmake -S "$ROOT" -B "$B" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_QT=OFF -DENABLE_NOGUI=ON -DORCA_VERSION="$ORCA_VERSION" \
            -DORCA_BUILD_DISC_TOOLS=ON \
            -DUSE_SYSTEM_LIBS=OFF -DENCODE_FRAMEDUMPS=OFF -DENABLE_LLVM=OFF \
            -DENABLE_ANALYTICS=OFF -DENABLE_AUTOUPDATE=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_RETRO_ACHIEVEMENTS=OFF -DUSE_MGBA=OFF -DUSE_UPNP=OFF -DENABLE_VULKAN=ON \
            -DENABLE_CLI_TOOL=ON -DENABLE_TESTS=OFF -DUSE_SANITIZERS=OFF \
            -DORCA_BUNDLE_TRUST_TEST_KEY=OFF -DORCA_BUNDLE_PUBLIC_KEY="$BUNDLE_KEY" \
            -DENABLE_ALSA=OFF -DENABLE_PULSEAUDIO=OFF -DENABLE_BLUEZ=OFF -DENABLE_EVDEV=OFF \
            -DENABLE_HWDB=OFF -DCMAKE_DISABLE_FIND_PACKAGE_LIBUDEV=ON -DUSE_SYSTEM_ICONV=ON \
            -DCMAKE_C_FLAGS="-ffile-prefix-map=$ROOT=." -DCMAKE_CXX_FLAGS="-ffile-prefix-map=$ROOT=." \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" >/dev/null
          cmake --build "$B" --target dolphin-tool --parallel 4
          grep -q "SCM_REV_STR \"$ORCA_SOURCE_COMMIT\"" "$B/Source/Core/Common/scmrev.h"
          EXE=$(find "$B/Binaries" -maxdepth 2 -type f -name dolphin-tool | head -1); test -n "$EXE"
          T="$RUNNER_TEMP/dolphin-tool"; O="$RUNNER_TEMP/tool-out"; mkdir -p "$T" "$O"
          cp "$EXE" "$T/dolphin-tool"; strip "$T/dolphin-tool"
          cp COPYING "$T/COPYING.txt"; cp -R LICENSES "$T/LICENSES"
          "$T/dolphin-tool" --help 2>&1 | head -15 || true
          "$T/dolphin-tool" extract --help 2>&1 | head -30 || true
          readelf -d "$T/dolphin-tool" | grep NEEDED || true
          (cd "$T" && find . -type f | sed 's#^\./##' | LC_ALL=C sort | xargs sha256sum) > "$O/TOOL-SHA256SUMS"
          { echo '```text'; cat "$O/TOOL-SHA256SUMS"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          Z="$O/yg-dolphin-${ORCA_VERSION}-linux-x64-dolphin-tool.zip"
          (cd "$T" && zip -qr -X "$Z" .)
          (cd "$O" && sha256sum "$(basename "$Z")" | tee SHA256SUMS)

      - name: Upload dolphin-tool and its sha256 manifests (cli_tool)
        if: ${{ inputs.cli_tool }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned 2026-10-24
        with:
          name: yg-dolphin-${{ inputs.version }}-${{ inputs.commit }}-linux-x64-dolphin-tool
          path: ${{ runner.temp }}/tool-out/
          retention-days: 14
          if-no-files-found: error
